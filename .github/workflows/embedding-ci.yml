name: Embedding Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "embedding-service/**"
      - ".github/workflows/embedding-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "embedding-service/**"
      - ".github/workflows/embedding-ci.yml"

concurrency:
  group: embedding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: embedding-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: embedding-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test — import app
        run: python -c "from app import app; print('FastAPI app loaded OK')"

  build-and-push:
    name: Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./embedding-service
          file: ./embedding-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-scrum-embedding:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ai-scrum-embedding:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
